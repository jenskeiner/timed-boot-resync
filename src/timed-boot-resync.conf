# timed-boot-resync configuration (shell-sourced by the daemon).

# NTP server to sync against. A LAN server (e.g. your router) is reachable
# earliest at boot, before DNS/WAN; time.apple.com is the safe default.
SERVER="time.apple.com"

# Offset (seconds) tolerated before the daemon intervenes.
# TOL="2"

# Network wait: number of ~2s loops before giving up.
# MAX_WAIT="60"
